<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Boston Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom">
                    <div class="logo">Boston Restaurant</div>
                </div>
                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="menu.html">
                            <i class="fas fa-utensils me-2"></i> Menu
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="orders.html">
                            <i class="fas fa-receipt me-2"></i> Orders
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link active" href="billing.html">
                            <i class="fas fa-file-invoice-dollar me-2"></i> Billing
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="profile.html">
                            <i class="fas fa-user me-2"></i> Profile
                        </a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="index.html" id="logout">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Billing</h2>
                    <button class="btn btn-primary" id="generate-bill">
                        <i class="fas fa-file-invoice me-2"></i> Generate Bill
                    </button>
                </div>
                
                <div class="row">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Order Items</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>Item</th>
                                                <th>Price</th>
                                                <th>Quantity</th>
                                                <th>Total</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="bill-items">
                                            <!-- Bill items will be populated by JavaScript -->
                                        </tbody>
                                    </table>
                                </div>
                                <div class="d-flex justify-content-between mt-3">
                                    <div>
                                        <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">
                                            <i class="fas fa-plus me-2"></i> Add Food Item
                                        </button>
                                    </div>
                                    <div>
                                        <h5>Subtotal: <span id="subtotal">$0.00</span></h5>
                                        <h5>Discount: <span id="discount">$0.00</span></h5>
                                        <h4>Total: <span id="total">$0.00</span></h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Customer Details</h5>
                            </div>
                            <div class="card-body">
                                <form>
                                    <div class="mb-3">
                                        <label for="customer-name" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="customer-name">
                                    </div>
                                    <div class="mb-3">
                                        <label for="customer-phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="customer-phone">
                                    </div>
                                    <div class="mb-3">
                                        <label for="customer-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="customer-email">
                                    </div>
                                    <div class="mb-3">
                                        <label for="discount-percent" class="form-label">Discount (%)</label>
                                        <input type="number" class="form-control" id="discount-percent" min="0" max="100" value="0">
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item to Bill Modal -->
    <div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addItemModalLabel">Add Item to Bill</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="add-item-form">
                        <div class="mb-3">
                            <label for="item-select" class="form-label">Select Item</label>
                            <select class="form-select" id="item-select">
                                <!-- Items will be populated by JavaScript -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="item-quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="item-quantity" min="1" value="1">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="add-to-bill">Add to Bill</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/billing.js"></script>
</body>
</html>
