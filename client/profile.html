<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Boston Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom">
                    <div class="logo">Boston Restaurant</div>
                </div>
                <ul class="nav flex-column p-3">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="menu.html">
                            <i class="fas fa-utensils me-2"></i> Menu
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="orders.html">
                            <i class="fas fa-receipt me-2"></i> Orders
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="billing.html">
                            <i class="fas fa-file-invoice-dollar me-2"></i> Billing
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link active" href="profile.html">
                            <i class="fas fa-user me-2"></i> Profile
                        </a>
                    </li>
                    <li class="nav-item mt-5">
                        <a class="nav-link text-danger" href="index.html" id="logout">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>User Profile</h2>
                </div>
                
                <div class="row">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <img src="https://via.placeholder.com/150" class="rounded-circle mb-3" alt="Profile Picture">
                                <h5 id="profile-name">John Doe</h5>
                                <p id="profile-role">Restaurant Manager</p>
                                <button class="btn btn-outline-primary btn-sm">Change Photo</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Personal Information</h5>
                            </div>
                            <div class="card-body">
                                <form id="profile-form">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="profile-fullname" class="form-label">Full Name</label>
                                            <input type="text" class="form-control" id="profile-fullname" value="John Doe">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="profile-email" class="form-label">Email</label>
                                            <input type="email" class="form-control" id="profile-email" value="john.doe@example.com">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="profile-phone" class="form-label">Phone</label>
                                            <input type="tel" class="form-control" id="profile-phone" value="+1 (555) 123-4567">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="profile-role" class="form-label">Role</label>
                                            <input type="text" class="form-control" id="profile-role" value="Restaurant Manager" readonly>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="profile-address" class="form-label">Address</label>
                                        <textarea class="form-control" id="profile-address" rows="3">123 Main Street, Boston, MA 02108</textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Update Profile</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
